<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" role="img" aria-label="주문서 퍼널: 주문서 진입 279명, 결제 버튼 클릭 198명, 결제 완료 171명">
